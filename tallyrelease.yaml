# yaml-language-server: $schema=https://cdn.jsdelivr.net/npm/@tallyrelease/cli@0/dist/tallyrelease.schema.json
plugins:
  node: {}

defaults:
  # Matches the existing tags
  tagFormat: "payloadcms-{id}-v{version}"
  # One release PR per package.
  releasePr: separate

branches:
  - name: main
    line: default
    channels:
      build: beta
  # Maintenance lines per package, cut from a tag: release/<package>/<major>.x.
  - name: "release/colophon/{major}.x"
    line: maintenance
    unit: colophon
  - name: "release/dummy/{major}.x"
    line: maintenance
    unit: dummy
  - name: "release/email-lettermint/{major}.x"
    line: maintenance
    unit: email-lettermint
  - name: "release/flue/{major}.x"
    line: maintenance
    unit: flue
  - name: "release/hatchet/{major}.x"
    line: maintenance
    unit: hatchet
  - name: "release/mcpx/{major}.x"
    line: maintenance
    unit: mcpx
  - name: "release/oidc/{major}.x"
    line: maintenance
    unit: oidc
  - name: "release/montage/{major}.x"
    line: maintenance
    unit: montage
  - name: "release/viewfinder/{major}.x"
    line: maintenance
    unit: viewfinder
  - name: "release/wayfinder/{major}.x"
    line: maintenance
    unit: wayfinder

units:
  packages/colophon: { release: true, tags: [dist] }
  packages/dummy: { release: true, tags: [dist] }
  packages/email-lettermint: { release: true, tags: [dist] }
  packages/flue: { release: true, tags: [dist], initialVersion: 0.1.0 }
  packages/hatchet: { release: true, tags: [dist], initialVersion: 0.1.0 }
  packages/mcpx: { release: true, tags: [dist] }
  packages/montage: { release: true, tags: [dist] }
  packages/oidc: { release: true, tags: [dist], initialVersion: 0.1.0 }
  packages/viewfinder: { release: true, tags: [dist] }
  packages/wayfinder: { release: true, tags: [dist] }

# Changes here rebuild every unit (added to the node plugin defaults).
globalInputs:
  - .tool-versions

ignore:
  - "*.md"
  - .github/**
  - .husky/**
  - .idea/**
  - .editorconfig
  - .gitattributes
