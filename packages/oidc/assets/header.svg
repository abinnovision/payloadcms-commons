<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="320" viewBox="0 0 1152 320" role="img" aria-label="payloadcms-oidc: the admin login page has no password form and forwards to one OpenID Connect provider, whose claims create and update the Payload user and map to its roles on every sign-in">
  <rect width="1152" height="320" fill="#0B0C0E"/>
  <g>
    <text x="72" y="126" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#6B7079" letter-spacing="0.6">@abinnovision/</text>
    <text x="72" y="170" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="30" fill="#EDEDEF" letter-spacing="-0.4">payloadcms-oidc</text>
    <text x="72" y="202" font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#6B7079">Single sign-on through one OIDC provider</text>
  </g>

  <!-- Admin login: password form gone, one button out -->
  <rect x="478" y="80" width="150" height="148" rx="6" fill="none" stroke="#212429"/>
  <rect x="494" y="100" width="56" height="10" rx="2" fill="#4C525B"/>
  <g fill="none" stroke="#2A2E34" stroke-dasharray="3 4">
    <rect x="494" y="124" width="118" height="22" rx="4"/>
    <rect x="494" y="154" width="118" height="22" rx="4"/>
  </g>
  <rect x="494" y="190" width="118" height="22" rx="4" fill="#D98E3D"/>
  <rect x="516" y="198" width="60" height="6" rx="2" fill="#0B0C0E" opacity="0.55"/>
  <path d="M586 197.5L591 201L586 204.5" fill="none" stroke="#0B0C0E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- Redirect to the provider -->
  <path d="M612 201C650 201 646 154 682 154" fill="none" stroke="#D98E3D" stroke-width="1.25" opacity="0.55"/>
  <path d="M682 154H690" stroke="#D98E3D" stroke-width="2"/>

  <!-- Provider: validated ID token claims -->
  <g transform="translate(762 58)" fill="none" stroke="#D98E3D" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-6" cy="0" r="6"/>
    <path d="M0 0H12M8 0V4M12 0V5"/>
  </g>
  <rect x="690" y="80" width="160" height="148" rx="6" fill="none" stroke="#212429"/>
  <g>
    <rect x="706" y="102" width="34" height="8" rx="2" fill="#4C525B"/>
    <rect x="770" y="102" width="64" height="8" rx="2" fill="#D98E3D" opacity="0.8"/>
    <rect x="706" y="134" width="44" height="8" rx="2" fill="#4C525B"/>
    <rect x="784" y="134" width="50" height="8" rx="2" fill="#D98E3D" opacity="0.8"/>
    <rect x="706" y="166" width="38" height="8" rx="2" fill="#4C525B"/>
    <rect x="796" y="166" width="38" height="8" rx="2" fill="#D98E3D" opacity="0.8"/>
    <rect x="706" y="198" width="50" height="8" rx="2" fill="#4C525B"/>
    <rect x="778" y="198" width="56" height="8" rx="2" fill="#D98E3D" opacity="0.8"/>
  </g>

  <!-- Claims onto user fields; the groups claim maps to roles -->
  <g fill="none" stroke="#D98E3D" stroke-width="1.25" opacity="0.55">
    <path d="M834 106C878 106 878 110 912 110"/>
    <path d="M834 138C878 138 878 138 912 138"/>
    <path d="M834 170C878 170 878 166 912 166"/>
    <path d="M834 202C878 202 878 214 912 214"/>
  </g>

  <!-- Payload user document -->
  <rect x="912" y="52" width="160" height="208" rx="6" fill="none" stroke="#212429"/>
  <rect x="928" y="74" width="64" height="10" rx="2" fill="#4C525B"/>
  <g>
    <rect x="928" y="106" width="30" height="8" rx="2" fill="#3F444C"/>
    <rect x="980" y="106" width="60" height="8" rx="2" fill="#D98E3D" opacity="0.8"/>
    <rect x="928" y="134" width="38" height="8" rx="2" fill="#3F444C"/>
    <rect x="980" y="134" width="76" height="8" rx="2" fill="#D98E3D" opacity="0.8"/>
    <rect x="928" y="162" width="34" height="8" rx="2" fill="#3F444C"/>
    <rect x="980" y="162" width="52" height="8" rx="2" fill="#D98E3D" opacity="0.8"/>
  </g>
  <path d="M928 186H1056" stroke="#212429"/>
  <rect x="928" y="210" width="34" height="8" rx="2" fill="#3F444C"/>
  <rect x="980" y="207" width="40" height="14" rx="7" fill="none" stroke="#D98E3D"/>
  <rect x="1026" y="207" width="30" height="14" rx="7" fill="none" stroke="#D98E3D"/>
  <rect x="928" y="236" width="44" height="8" rx="2" fill="#2F343B"/>
  <rect x="980" y="236" width="48" height="8" rx="2" fill="#2F343B"/>
  <g fill="none" stroke="#6B7079" stroke-width="1.25" stroke-linecap="round">
    <rect x="1050" y="108" width="9" height="7" rx="1.5"/>
    <path d="M1052 108V105.5a2.5 2.5 0 0 1 5 0V108"/>
  </g>

  <g font-family="system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" letter-spacing="1.4" text-anchor="middle">
    <text x="553" y="286" fill="#6B7079">ADMIN LOGIN</text>
    <text x="770" y="286" fill="#D98E3D">PROVIDER CLAIMS</text>
    <text x="992" y="286" fill="#6B7079">PAYLOAD USER</text>
  </g>
</svg>
